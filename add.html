<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Add Transaction</title>

    <!-- Google Font -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/mobile.css">

    <link rel="stylesheet" href="css/theme.css">

    <link rel="stylesheet" href="css/add.css">

</head>

<body class="dark-theme">

<div class="container add-page">

    <!-- Header -->

    <header class="header">

        <a href="index.html" class="icon">

            <i class="fas fa-arrow-left"></i>

        </a>

        <div class="logo">

            Add Transaction

        </div>

        <div class="icon">

            <i class="fas fa-wallet"></i>

        </div>

    </header>

    <!-- Transaction Type -->

    <div class="type-switch">

        <button
            id="expenseBtn"
            class="type-btn active"
            type="button">

            Expense

        </button>

        <button
            id="incomeBtn"
            class="type-btn"
            type="button">

            Income

        </button>

    </div>

    <input
        type="hidden"
        id="type"
        value="Expense">

    <!-- =========================
         Amount
    ========================== -->

    <div class="form-group">

        <label for="amount">

            Amount

        </label>

        <div class="amount-box">

            <span class="currency-symbol">₹</span>

            <input
                type="number"
                id="amount"
                class="input amount-input"
                placeholder="0.00"
                min="0"
                step="0.01">

        </div>

    </div>

    <!-- =========================
         Category
    ========================== -->

    <div class="form-group">

        <label for="category">

            Category

        </label>

        <select
            id="category"
            class="input">

            <option value="">Select Category</option>

            <option value="Food">🍔 Food</option>
            <option value="Shopping">🛍 Shopping</option>
            <option value="Travel">✈ Travel</option>
            <option value="Bills">💡 Bills</option>
            <option value="Medical">🏥 Medical</option>
            <option value="Education">📚 Education</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Salary">💰 Salary</option>
            <option value="Business">🏢 Business</option>
            <option value="Investment">📈 Investment</option>
            <option value="Other">📦 Other</option>

        </select>

    </div>

    <!-- =========================
         Date & Time
    ========================== -->

    <div class="form-row">

        <div class="form-group">

            <label for="date">

                Date

            </label>

            <input
                type="date"
                id="date"
                class="input">

        </div>

        <div class="form-group">

            <label for="time">

                Time

            </label>

            <input
                type="time"
                id="time"
                class="input">

        </div>

    </div>

    <!-- =========================
         Payment Method
    ========================== -->

    <div class="form-group">

        <label for="payment">

            Payment Method

        </label>

        <select
            id="payment"
            class="input">

            <option value="Cash">💵 Cash</option>

            <option value="UPI">📱 UPI</option>

            <option value="Debit Card">💳 Debit Card</option>

            <option value="Credit Card">💳 Credit Card</option>

            <option value="Bank Transfer">🏦 Bank Transfer</option>

        </select>
</div>


   <div class="form-group">

<label>

Receipt Photos (Optional)

</label>

<div class="receipt-buttons">

<label
for="galleryInput"
class="receipt-btn">

<i class="fas fa-images"></i>

Choose Photos

</label>

<label
for="cameraInput"
class="receipt-btn camera">

<i class="fas fa-camera"></i>

Open Camera

</label>

</div>

<input
id="galleryInput"
type="file"
accept="image/*"
multiple
hidden>

       <input
               id="cameraInput"
               type="file"
               accept="image/*"
               capture="environment"
               hidden
               onclick="this.setAttribute('capture','environment')">
<div
id="receiptPreview"
class="receipt-grid">

</div>

</div>
    <!-- =========================
         Notes
    ========================== -->

    <div class="form-group">

        <label for="note">

            Notes

        </label>

        <textarea
            id="note"
            class="input"
            rows="4"
            placeholder="Write a note (optional)..."></textarea>

    </div>

    <!-- =========================
         Tags (Optional)
    ========================== -->

    <div class="form-group">

        <label for="tags">

            Tags (Optional)

        </label>

        <input
            type="text"
            id="tags"
            class="input"
            placeholder="Example: Office, Family, Personal">

    </div>

    <!-- =========================
         Action Buttons
    ========================== -->

    <div class="action-buttons">

        <button
            type="button"
            class="cancel-btn"
            onclick="window.location.href='index.html'">

            <i class="fas fa-times"></i>

            Cancel

        </button>

        <button
            type="button"
            class="save-btn"
            onclick="saveExpense()">

            <i class="fas fa-save"></i>

            Save Transaction

        </button>

    </div>

</div>



<!-- =========================
     JavaScript
========================== -->

<script src="js/app.js"></script>

<script src="js/add.js"></script>

<div id="toast" class="toast"></div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reminders</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/reminders.css">

</head>

<body class="dark-theme">

<div class="container">

<header class="header">

<a href="index.html" class="icon">

<i class="fas fa-arrow-left"></i>

</a>

<div class="logo">

Reminders

</div>

<div class="icon notification-icon">

<i class="fas fa-bell"></i>

<span id="bellBadge">

0

</span>

</div>
</header>

<section class="reminder-dashboard">

<div class="dashboard-card upcoming">

<h3>Upcoming</h3>

<h1 id="upcomingCount">0</h1>

</div>

<div class="dashboard-card overdue">

<h3>Overdue</h3>

<h1 id="overdueCount">0</h1>

</div>

<div class="dashboard-card completed">

<h3>Completed</h3>

<h1 id="completedCount">0</h1>

</div>

</section>

<section class="section">

<div class="section-header">

<h3>Add Reminder</h3>

</div>

<div class="card">

<input
type="text"
id="reminderTitle"
placeholder="Reminder Title">

<input
type="date"
id="reminderDate">

<input
type="time"
id="reminderTime">
<select id="repeatType">

<option value="none">

Repeat : None

</option>

<option value="daily">

Repeat Daily

</option>

<option value="weekly">

Repeat Weekly

</option>

<option value="monthly">

Repeat Monthly

</option>

</select>

<select id="snoozeTime">

<option value="0">

Snooze : None

</option>

<option value="5">

5 Minutes

</option>

<option value="10">

10 Minutes

</option>

</select>


    <label>Reminder Sound</label>

    <select id="reminderSoundType">

        <option value="beep.mp3">🔔 Beep</option>

        <option value="sparkle.mp3">⏰ sparkle</option>

        <option value="chime.mp3">🎵 Chime</option>

        <option value="universe.mp3">🐦 universe</option>

        <option value="soundreality.mp3">📢 Digital Beep</option>

        <option value="notification.mp3">🛕 beeze </option>

    </select>

    <button
            type="button"
            class="btn-secondary"
            onclick="previewReminderSound()">

        ▶ Preview Sound

    </button>

    <label>Volume</label>

    <input
            type="range"
            id="soundVolume"
            min="0"
            max="1"
            step="0.1"
            value="1"
            oninput="changeReminderVolume()">

    <select id="reminderType">

<option value="Payment">

Payment Reminder

</option>

<option value="Receive">

Receive Money

</option>

<option value="EMI">

EMI

</option>

<option value="Credit Card">

Credit Card

</option>

<option value="Custom">

Custom

</option>

</select>

<textarea
id="reminderNote"
placeholder="Notes"></textarea>

<button
class="btn-primary"
onclick="saveReminder()">

Save Reminder

</button>

</div>

</section>



<section class="section">

<div class="section-header">

<h3>

Upcoming Reminders

</h3>

</div>

<div id="upcomingList">

</div>

</section>

<section class="section">

<div class="section-header">

<h3>

Overdue

</h3>

</div>

<div id="overdueList">

</div>

</section>

<section class="section">

<div class="section-header">

<h3>

Completed

</h3>

</div>

<div id="completedList">

</div>

</section>

<a href="#"
class="fab"
onclick="window.scrollTo(0,0)">

<i class="fas fa-plus"></i>

</a>

    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/reminders.js"></script>

    <div id="toast" class="toast"></div>

    <audio id="reminderSound" preload="auto"></audio>



    <div id="deleteReminderModal" class="modal">

        <div class="modal-content">

            <h3>Delete Reminder?</h3>

            <p>Are you sure you want to delete this reminder?</p>

            <div class="modal-buttons">

                <button
                        class="btn-secondary"
                        onclick="closeDeleteReminder()">

                    Cancel

                </button>

                <button
                        class="btn-danger"
                        onclick="confirmDeleteReminder()">

                    Delete

                </button>

            </div>

        </div>

    </div>

</body>
</html>

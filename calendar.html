<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calendar</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/mobile.css">

    <link rel="stylesheet" href="css/theme.css">

    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="stylesheet" href="css/calendar.css">

</head>

<body class="dark-theme">

<div class="container">

<header class="header">

<a href="index.html" class="icon">

<i class="fas fa-arrow-left"></i>

</a>

<div class="logo">

Calendar

</div>

<div class="icon">

<i class="fas fa-calendar-days"></i>

</div>

</header>

<main class="dashboard">

    <!-- =========================
         Calendar Header
    ========================== -->

    <section class="calendar-header">

        <button id="prevMonth" class="nav-btn">

            <i class="fas fa-chevron-left"></i>

        </button>

        <h2 id="monthYear" class="month-title">

            July 2026

        </h2>

        <button id="nextMonth" class="nav-btn">

            <i class="fas fa-chevron-right"></i>

        </button>

    </section>

    <!-- Week Days -->

    <section class="week-days">

        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>

    </section>

    <!-- Calendar -->

    <section
        id="calendarGrid"
        class="calendar-grid">

    </section>

        <!-- =========================
         Monthly Summary
    ========================== -->

    <section class="section">

        <div class="section-header">

            <h3>Monthly Summary</h3>

        </div>

        <div class="summary">

            <div class="summary-card income">

                <h4>Income</h4>

                <h2 id="monthIncome">₹0</h2>

            </div>

            <div class="summary-card expense">

                <h4>Expense</h4>

                <h2 id="monthExpense">₹0</h2>

            </div>

        </div>

    </section>

    <!-- =========================
         Budget Progress
    ========================== -->

    <section class="section">

        <div class="section-header">

            <h3>Budget Progress</h3>

        </div>

        <div class="analytics-card">

            <div class="analytics-title">

                Monthly Budget

            </div>

            <div class="progress-bar">

                <div
                    id="budgetProgress"
                    class="progress-fill">

                </div>

            </div>

            <div
                id="budgetText"
                class="analytics-value">

                ₹0 / ₹0

            </div>

        </div>

    </section>

    <!-- =========================
         Day Transactions Popup
    ========================== -->

    <div id="dayPopup" class="popup-overlay">

        <div class="popup-card">

            <div class="popup-header">

                <h3 id="popupDate">

                    Transactions

                </h3>

                <button
                    id="closePopup"
                    class="nav-btn">

                    <i class="fas fa-times"></i>

                </button>

            </div>

            <div id="popupSummary">

            </div>

            <div id="popupTransactions">

            </div>

        </div>

    </div>
    


<!-- JavaScript -->

<script src="js/app.js"></script>

<script src="js/calendar.js"></script>
    <div id="toast" class="toast"></div>

</body>

</html>
